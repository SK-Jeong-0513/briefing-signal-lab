name: Update daily market quotes

on:
  schedule:
    # 21:10 UTC = 06:10 KST. 미 동부 겨울 장 마감 10분 후이며,
    # GitHub 예약 지연이 약 1시간이어도 07:25(메일 트리거 최초 시각) 전에 완료할 여유를 둔다.
    #
    # ⚠️ 매일 돈다(UTC 요일 제한 없음). 예전에는 KST 평일만 덮으려고 0-4 였는데,
    #    일일 메일은 sendDailyMarket 이 everyDays(1) 로 **주말에도 나간다.** 주말에
    #    quotes.json 이 갱신되지 않으면 briefing_date 가 금요일에 머물고, 메일러의
    #    quotes_() 가 '전일 데이터 차단' 게이트에서 블록을 통째로 생략한다
    #    (2026-08-08 토·08-09 일 실제 누락).
    #    주말에 돌려도 안전하다 — fetch_dashboard.py 의 asof 는 Yahoo 응답의 실제
    #    마지막 거래일이라 금요일 마감이 찍히고, 메일 헤더가 '미 증시 MM-DD 마감'
    #    으로 그 사실을 표기한다.
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fetch daily market quotes
        run: python3 scripts/fetch_dashboard.py --quotes-only
      - name: Commit, push & deploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/data/quotes.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 일일 시황 지표 조기 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy-pages.yml
          fi
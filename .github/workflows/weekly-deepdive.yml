name: Weekly deep-dive scoring

# 월요일 06:00 KST: 발행 예약된 ready 항목을 채점해 카테고리별 딥다이브 3건을 만든다.
#
# 순서: 04:00 게이트 → **06:00 여기** → 09:00 발송. 게이트 뒤이자 발송 앞이어야 한다.
#   - 04:00 보다 앞서면 auto_ready 항목이 아직 없다.
#   - 09:00 을 넘기면 그 호는 딥다이브 없이 나간다(발송을 막지는 않는다 — 사이트에서
#     다음 호까지 비어 보일 뿐이다). GitHub 예약 크론은 20~30분 늦게 도는 것이 정상이라
#     3시간 버퍼를 둔다.
#
# ⚠️ 채점 대상은 '상태=ready' 다. 'published' 는 발송 **직전**에 찍혀서 그때는 이미 늦다.
#    발송이 끝난 호는 published 행이 생기므로 이 잡이 다시 돌아도 no-op 이다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"   # 일 21:00 UTC = 월 06:00 KST

permissions:
  contents: read

concurrency:
  group: weekly-deepdive
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Score and build weekly deep-dive
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DATA_GO_DEEPSEEK }}
          GEMINI_API_KEY: ${{ secrets.DATA_GO_GEMINI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          SETTINGS_CSV: ${{ secrets.SETTINGS_CSV }}
          WEEKLY_RELEASE_ITEMS_CSV: ${{ secrets.WEEKLY_RELEASE_ITEMS_CSV }}
          # 재실행 안전장치. 없으면 이미 채점된 호를 다시 채점한다(중복 행이 쌓인다).
          WEEKLY_DEEPDIVE_CSV: ${{ secrets.WEEKLY_DEEPDIVE_CSV }}
          WEEKLY_WEBAPP_URL: ${{ secrets.MARKET_WEBAPP_URL }}
          WEEKLY_WEBAPP_TOKEN: ${{ secrets.MARKET_WEBAPP_TOKEN }}
          DEEPDIVE_PER_CATEGORY: "3"
        run: python3 scripts/score_weekly_deepdive.py

name: Weekly briefing publish and email

# 월요일 07:20 KST 고정 호출(2026-09-27 09:00 → 07:20 — 일일 시황 자리를 대신한다, 아래 참조). Apps Script 내부 발송 로그가 재시도 중복을 막는다.
#
# 실제 정시성은 Apps Script 시간 트리거(sendWeekly, 월 07:20)가 담보한다.
# ⚠️ 07:20 인 이유: Resend 일일 한도(100)는 UTC 하루(= KST 09:00~09:00)로 센다. 09:00 에 보내면
#    화요일 07:20 일일과 같은 UTC 월요일에 들어가 58+58 로 넘는다. 월요일 일일은 원래 쉬므로
#    07:20 에 보내면 주간이 그 자리를 대신하고 어느 UTC 하루에도 한 배치만 들어간다.
# 이 워크플로는 백스톱이다 — GitHub Actions cron 은 상시 1~2시간 지연되고
# 00:00 UTC 는 가장 혼잡한 슬롯이라 정시 도착을 여기에 기대면 안 된다.
# 먼저 도는 쪽이 발송하고 나중 쪽은 발송로그를 보고 no-op 한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 0"   # 일 22:20 UTC = 월 07:20 KST

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Publish issue and send weekly email
        env:
          WEEKLY_MAILER_URL: ${{ secrets.WEEKLY_MAILER_URL }}
          WEEKLY_MAILER_TOKEN: ${{ secrets.WEEKLY_MAILER_TOKEN }}
        run: python3 scripts/trigger_weekly_mailer.py
